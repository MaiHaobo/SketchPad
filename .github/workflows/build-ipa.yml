name: Build IPA

# ─────────────────────────────────────────────────────────────
# 在 GitHub 的 macOS 机器上编译 SketchPad 并产出 .ipa 安装包
#
# 触发方式：
#   1. 手动触发（Actions 页面点 "Run workflow"）
#   2. 推送 tag（如 v1.0）时自动打包并创建 Release
#
# 需要的 Secrets（Settings → Secrets and variables → Actions）：
#   BUILD_CERTIFICATE_BASE64    .p12 证书的 base64 文本
#   P12_PASSWORD                .p12 证书密码
#   BUILD_PROVISION_PROFILE_BASE64  .mobileprovision 的 base64 文本
#   KEYCHAIN_PASSWORD           临时钥匙串密码（随便设一个，如 sketchpad123）
#
#   ● 可选（用于导出 ad-hoc / development 包，不填则用默认模板）
#   EXPORT_METHOD               development / ad-hoc / app-store（默认 ad-hoc）
# ─────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      export_method:
        description: '导出方式'
        required: true
        default: 'ad-hoc'
        type: choice
        options:
          - ad-hoc
          - development
          - app-store
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: 编译并打包 IPA
    runs-on: macos-14
    timeout-minutes: 40

    steps:
      # ── 1. 拉取代码 ──
      - name: 📥 检出代码
        uses: actions/checkout@v4

      # ── 2. 选择 Xcode 版本 ──
      - name: 🛠 选择 Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer 2>/dev/null \
            || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          echo "--- 可用 SDK ---"
          xcodebuild -showsdks | grep -i ios || true

      # ── 3. 安装签名证书与描述文件 ──
      - name: 🔐 导入签名证书
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail

          CERT_PATH="$RUNNER_TEMP/build_certificate.p12"
          PP_PATH="$RUNNER_TEMP/build_pp.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"

          # 写出证书与描述文件
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"

          # 创建临时钥匙串
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # 导入证书
          security import "$CERT_PATH" -P "$P12_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          # 安装描述文件
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PP_UUID=$(security cms -D -i "$PP_PATH" | /usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin)
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$PP_UUID".mobileprovision

          echo "✅ 证书已导入，描述文件 UUID: $PP_UUID"
          echo "PP_UUID=$PP_UUID" >> "$GITHUB_ENV"

      # ── 4. 生成 ExportOptions.plist（用实际签名信息）──
      - name: 📝 生成 ExportOptions.plist
        env:
          EXPORT_METHOD: ${{ github.event.inputs.export_method || 'ad-hoc' }}
        run: |
          set -euo pipefail

          TEAM_ID=$(security cms -D -i ~/Library/MobileDevice/Provisioning\ Profiles/"$PP_UUID".mobileprovision \
            | /usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' /dev/stdin)
          BUNDLE_ID=$(security cms -D -i ~/Library/MobileDevice/Provisioning\ Profiles/"$PP_UUID".mobileprovision \
            | /usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' /dev/stdin | cut -d. -f2-)

          echo "Team ID   : $TEAM_ID"
          echo "Bundle ID : $BUNDLE_ID"

          # 供后续步骤使用
          echo "TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"
          echo "BUNDLE_ID=$BUNDLE_ID" >> "$GITHUB_ENV"

          # 把工程里的 Bundle ID 对齐成描述文件里登记的（避免不匹配）
          sed -i '' "s/com\.sketchpad\.ink/$BUNDLE_ID/g" SketchPad.xcodeproj/project.pbxproj

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>$EXPORT_METHOD</string>
              <key>teamID</key>
              <string>$TEAM_ID</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>compileBitcode</key>
              <false/>
              <key>provisioningProfiles</key>
              <dict>
                  <key>$BUNDLE_ID</key>
                  <string>$PP_UUID</string>
              </dict>
          </dict>
          </plist>
          EOF

          echo "--- ExportOptions.plist ---"
          cat "$RUNNER_TEMP/ExportOptions.plist"

      # ── 5. 编译 Archive ──
      - name: 🔨 编译 (xcodebuild archive)
        run: |
          set -euo pipefail

          # Apple 免费账号不支持 iCloud capability；若签名失败会自动降级
          set +e
          xcodebuild archive \
            -project SketchPad.xcodeproj \
            -scheme SketchPad \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/SketchPad.xcarchive" \
            -allowProvisioningUpdates \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Development" \
            PROVISIONING_PROFILE_SPECIFIER="$PP_UUID" \
            | tee "$RUNNER_TEMP/archive.log"
          ARCHIVE_EXIT=${PIPESTATUS[0]}
          set -e

          if [ "$ARCHIVE_EXIT" -ne 0 ]; then
            echo ""
            echo "════════ 首次编译失败，尝试移除 iCloud entitlements 后重试 ════════"
            # 个人/免费证书签名通常不含 iCloud 权限，降级重试
            cp SketchPad/SketchPad.entitlements SketchPad/SketchPad.entitlements.bak
            cat > SketchPad/SketchPad.entitlements <<'ENT'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          </dict>
          </plist>
          ENT
            xcodebuild archive \
              -project SketchPad.xcodeproj \
              -scheme SketchPad \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath "$RUNNER_TEMP/SketchPad.xcarchive" \
              CODE_SIGN_STYLE=Manual \
              DEVELOPMENT_TEAM="$TEAM_ID" \
              CODE_SIGN_IDENTITY="Apple Development" \
              PROVISIONING_PROFILE_SPECIFIER="$PP_UUID" \
              | tee "$RUNNER_TEMP/archive-retry.log"
          fi

          echo "✅ Archive 完成"

      # ── 6. 导出 IPA ──
      - name: 📦 导出 IPA
        run: |
          set -euo pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/SketchPad.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            | tee "$RUNNER_TEMP/export.log"

          IPA=$(find "$RUNNER_TEMP/export" -name "*.ipa" | head -1)
          echo "IPA_PATH=$IPA" >> "$GITHUB_ENV"
          echo "✅ 产出: $IPA"
          ls -lh "$IPA"

      # ── 7. 上传产物 ──
      - name: ⬆️ 上传 IPA 到 Actions
        uses: actions/upload-artifact@v4
        with:
          name: SketchPad-IPA
          path: ${{ env.IPA_PATH }}
          retention-days: 30

      # ── 8. 失败时上传日志 ──
      - name: 📄 上传编译日志（仅失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            ${{ runner.temp }}/archive.log
            ${{ runner.temp }}/archive-retry.log
            ${{ runner.temp }}/export.log
          if-no-files-found: ignore

      # ── 9. 打 tag 时自动发 Release ──
      - name: 🚀 创建 Release（仅打 tag 时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.IPA_PATH }}
          name: 墨迹 SketchPad ${{ github.ref_name }}
          body: |
            自动构建的 IPA 安装包。

            安装方式见仓库中的《IPA安装指南》。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
